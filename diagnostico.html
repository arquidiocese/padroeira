<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico - Dados do Firebase</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: monospace; background: #1a1a2e; color: #e8f4fd; padding: 20px; }
        h1 { color: #5bc0eb; }
        .box { background: #1e3a5f; border-radius: 8px; padding: 15px; margin: 10px 0; }
        .count { font-size: 1.5rem; font-weight: bold; color: #81c784; }
        .zero { color: #ef5350; }
        pre { background: #0a1628; padding: 10px; border-radius: 6px; overflow-x: auto; font-size: 0.75rem; max-height: 300px; }
        button { background: #5bc0eb; color: #1e3a5f; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; margin: 5px; }
    </style>
</head>
<body>
    <h1>Diagnóstico - Dados no Firebase</h1>
    <p>Esta página SÓ LÊ o Firebase. Não altera nada.</p>
    <div id="resumo"></div>
    <button onclick="baixarBackup()">Baixar Backup JSON dos dados do Firebase</button>
    <div class="box">
        <h3>Dados completos (JSON):</h3>
        <pre id="json">Carregando...</pre>
    </div>

    <script src="firebase-config.js"></script>
    <script>
        let dadosFirebase = null;
        dbRef.once('value').then(snap => {
            dadosFirebase = snap.val();
            document.getElementById('json').textContent = JSON.stringify(dadosFirebase, null, 2);

            if (!dadosFirebase) {
                document.getElementById('resumo').innerHTML = '<div class="box zero">⚠️ O Firebase está VAZIO (nenhum dado no path /padroeira)</div>';
                return;
            }

            const cont = (arr) => {
                if (!arr) return 0;
                if (Array.isArray(arr)) return arr.length;
                return Object.keys(arr).length;
            };

            let html = '';
            html += `<div class="box">Patrocinadores: <span class="count ${cont(dadosFirebase.patrocinadores)===0?'zero':''}">${cont(dadosFirebase.patrocinadores)}</span></div>`;
            html += `<div class="box">Despesas: <span class="count">${cont(dadosFirebase.despesas)}</span></div>`;
            html += `<div class="box">Doações em dinheiro: <span class="count">${cont(dadosFirebase.doacoesEntrada)}</span></div>`;
            html += `<div class="box">Doadores (bingo): <span class="count">${cont(dadosFirebase.doadores)}</span></div>`;
            html += `<div class="box">Necessidades: <span class="count">${cont(dadosFirebase.necessidades)}</span></div>`;
            html += `<div class="box">Caixas: <span class="count">${cont(dadosFirebase.caixas)}</span></div>`;
            html += `<div class="box">Config Barracas (inclui Frango Assado): <span class="count ${cont(dadosFirebase.configBarracas)===0?'zero':''}">${cont(dadosFirebase.configBarracas)}</span><pre>${JSON.stringify(dadosFirebase.configBarracas, null, 2)}</pre></div>`;

            document.getElementById('resumo').innerHTML = html;
        }).catch(err => {
            document.getElementById('resumo').innerHTML = '<div class="box zero">Erro ao ler Firebase: ' + err.message + '</div>';
        });

        function baixarBackup() {
            if (!dadosFirebase) { alert('Nenhum dado carregado'); return; }
            const blob = new Blob([JSON.stringify({ evento: 'Festa da Padroeira 2026', exportadoEm: new Date().toISOString(), dados: dadosFirebase }, null, 2)], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'backup_firebase_padroeira.json';
            link.click();
        }
    </script>
</body>
</html>
